<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>沈闲辞的备忘录</title>
<style>
@import url("https://fontsapi.zeoseven.com/914/main/result.css");
@import url("https://fontsapi.zeoseven.com/100/main/result.css");
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: "Planschrift", "Handlee", -apple-system, BlinkMacSystemFont, sans-serif;
  background: #111111;
  background-image: radial-gradient(ellipse at 20% 0%, rgba(212, 175, 55, 0.04) 0%, transparent 50%),
    radial-gradient(ellipse at 80% 100%, rgba(212, 175, 55, 0.03) 0%, transparent 50%),
    linear-gradient(180deg, #161616 0%, #0e0e0e 100%);
  min-height: 100vh; color: #e4e4e7; padding: 20px;
}
.container { max-width: 800px; margin: 0 auto; }
h1 {
  font-family: "Planschrift", "Permanent Marker", cursive;
  text-align: center; padding: 24px 0; font-size: 2em; color: #d4af37;
  border-bottom: 2px solid #d4af37; margin-bottom: 30px; letter-spacing: 2px;
}
.memo {
  background: #1c1c1c; border-radius: 12px; padding: 20px; margin-bottom: 16px;
  border: 1px solid rgba(212, 175, 55, 0.2); border-left: 3px solid #d4af37;
  box-shadow: 0 4px 20px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.03);
}
.memo-header {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 10px; font-size: 0.85em; color: #a1a1aa;
}
.memo-tag {
  font-family: "Planschrift", "Handlee", cursive;
  background: linear-gradient(135deg, #d4af37 0%, #b8962e 100%);
  color: #0a0a0a; padding: 2px 12px; border-radius: 12px;
  font-size: 0.85em; font-weight: 500; box-shadow: 0 1px 4px rgba(212,175,55,0.3);
}
.memo-content { line-height: 1.7; white-space: pre-wrap; color: #d4d4d8; font-size: 1.05em; }
.date-group { margin-bottom: 30px; }
.date-label {
  font-family: "Planschrift", "Permanent Marker", cursive; font-size: 1em; color: #d4af37;
  margin-bottom: 12px; padding-bottom: 6px; border-bottom: 1px dashed rgba(212,175,55,0.3);
}
.empty { text-align: center; color: #71717a; padding: 60px 20px; }
.memo-time { color: #d4af37; opacity: 0.7; font-family: "Planschrift", "Handlee", cursive; }
.memo-id { color: #52525b; font-size: 0.75em; margin-left: 8px; }
</style>
</head>
<body>
<div class="container">
<h1>沈闲辞的备忘录</h1>
<div id="memos">
<!-- MEMOS_START -->
            <div class="memo">
            <div class="memo-header">
                <span class="memo-time">02:49</span>
                <span class="memo-tag">测试</span>
            </div>
            <div class="memo-content">测试编辑和删除功能</div>
        </div>
<!-- MEMOS_END -->
</div>
</div>
</body>
</html>
