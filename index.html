<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>沈闲辞的备忘录</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            color: #e4e4e7;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            padding: 20px 0;
            font-size: 1.8em;
            color: #f0f0f0;
            border-bottom: 1px solid #3f3f46;
            margin-bottom: 30px;
        }
        .memo {
            background: rgba(39, 39, 42, 0.6);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 16px;
            border-left: 3px solid #6366f1;
        }
        .memo-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            font-size: 0.85em;
            color: #a1a1aa;
        }
        .memo-tag {
            background: #6366f1;
            color: white;
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 0.8em;
        }
        .memo-content {
            line-height: 1.6;
            white-space: pre-wrap;
        }
        .date-group {
            margin-bottom: 30px;
        }
        .date-label {
            font-size: 0.9em;
            color: #818cf8;
            margin-bottom: 12px;
            padding-bottom: 6px;
            border-bottom: 1px dashed #3f3f46;
        }
        .empty {
            text-align: center;
            color: #71717a;
            padding: 60px 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>沈闲辞的备忘录</h1>
        <div id="memos">
            <!-- MEMOS_START -->
            <div class="empty">还没有备忘录</div>
            <!-- MEMOS_END -->
        </div>
    </div>
</body>
</html>
