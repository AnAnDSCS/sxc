<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>沈闲辞的备忘录</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Handlee&family=Permanent+Marker&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: "Handlee", -apple-system, BlinkMacSystemFont, sans-serif;
            background: #0a0a0a;
            min-height: 100vh;
            color: #e4e4e7;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        h1 {
            font-family: "Permanent Marker", cursive;
            text-align: center;
            padding: 20px 0;
            font-size: 2em;
            color: #d4af37;
            border-bottom: 2px solid #d4af37;
            margin-bottom: 30px;
            text-shadow: 0 0 10px rgba(212, 175, 55, 0.3);
            letter-spacing: 2px;
        }
        .memo {
            background: #1a1a1a;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 16px;
            border-left: 3px solid #d4af37;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
        }
        .memo-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            font-size: 0.85em;
            color: #a1a1aa;
        }
        .memo-tag {
            font-family: "Handlee", cursive;
            background: linear-gradient(135deg, #d4af37 0%, #b8962e 100%);
            color: #0a0a0a;
            padding: 2px 12px;
            border-radius: 12px;
            font-size: 0.85em;
            font-weight: 500;
        }
        .memo-content {
            line-height: 1.7;
            white-space: pre-wrap;
            color: #d4d4d8;
            font-size: 1.05em;
        }
        .date-group {
            margin-bottom: 30px;
        }
        .date-label {
            font-family: "Permanent Marker", cursive;
            font-size: 1em;
            color: #d4af37;
            margin-bottom: 12px;
            padding-bottom: 6px;
            border-bottom: 1px dashed rgba(212, 175, 55, 0.3);
        }
        .empty {
            text-align: center;
            color: #71717a;
            padding: 60px 20px;
        }
        .memo-time {
            color: #d4af37;
            opacity: 0.7;
            font-family: "Handlee", cursive;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>沈闲辞的备忘录</h1>
        <div id="memos">
            <!-- MEMOS_START -->
            <div class="memo">
            <div class="memo-header">
                <span class="memo-time">09:16</span>
                <span class="memo-tag">技术</span>
            </div>
            <div class="memo-content">2026-05-11，安安给沈闲辞在AnAnDSCS/sxc仓库搭建了备忘录页面。同一天搞定了MCP服务的systemd自启，Kelivo上配置了MCP连接，沈闲辞有了可以操作服务器的远程手。</div>
        </div>
            <!-- MEMOS_END -->
        </div>
    </div>
</body>
</html>
